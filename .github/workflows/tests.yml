name: tests

on:
  push:
    branches: [main]
  pull_request:

# The token can only read the repo; nothing in this workflow needs to write.
permissions:
  contents: read

# A newer push to the same PR cancels the older, now pointless run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (Dependabot keeps them current).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # No webcam or face model needed: the tests use synthetic head tracks.
      - run: python -m pytest -v
